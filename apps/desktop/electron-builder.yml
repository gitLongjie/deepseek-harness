# electron-builder configuration for the OEM desktop shell.
# Signing and notarization are pre-wired but left off: with no CSC_LINK /
# APPLE_* secrets in the environment, electron-builder skips Windows signing and
# macOS notarization (identity: null). Populate the CI secrets (see README) to
# enable real signing without touching this file.
appId: ai.deepagens.worker
# deploy-app.mjs supplies productName and platform-native derivatives through
# its generated dist/electron-builder.oem.json overlay.
# Keep the packaged application artwork aligned with the runtime window and
# tray icons. PNG is accepted by electron-builder on macOS and Linux; Windows
# overrides this with the OEM ICO below.
icon: build/icon.png
electronLanguages:
  - en-US
  - zh-CN
asar: true
# asarUnpack is NOT declared here: scripts/deploy-app.mjs injects it into the
# generated dist/electron-builder.oem.json overlay from
# src/main/desktop/packaged-resources.ts, the single source of truth shared
# with the app's boot-time completeness assertions. Keep native modules and
# Node-mode (ELECTRON_RUN_AS_NODE) load closures in that module.
# node-pty ships a prebuild matching this Electron's Node ABI; skipping the
# node-gyp rebuild avoids requiring a full native toolchain on every platform.
npmRebuild: false
# build/afterPack.cjs ad-hoc seals the mac bundle when no CSC_LINK/CSC_NAME is
# configured: identity: null leaves Electron's linker-signed resources
# unsealed, which macOS Gatekeeper reports as "damaged" with no bypass.
afterPack: build/afterPack.cjs
directories:
  # Relative to the electron-builder working directory (apps/desktop); kept
  # apart from the app's own dist/ (main-process build output).
  output: dist-electron
  buildResources: build
files:
  - dist/**/*.js
  - dist/**/*.map
  - web/**
  - config/**
  - build/**
  - cordis.patch.yml
  - package.json
  # The IM plugin is a local file dependency; electron-builder does not follow
  # pnpm's junction when collecting production dependencies. Include its
  # published runtime files explicitly so the loader can resolve the package.
  - from: dist/dsh-im-package
    to: node_modules/@xmanrui/dsh-im
    filter:
      - lib/**
      - cordis.patch.yml
      - package.json
  # Drop the app's own sources/tests/sourcemaps to keep the bundle slim. Keep
  # the globs app-relative (!src/**) so dependency sources that their package
  # main points at (e.g. debug -> src/index.js) are NOT excluded from node_modules.
  - '!src/**'
  - '!tests/**'
  - '!**/*.map'
  - '!**/*.tsbuildinfo'
win:
  # Windows Explorer, the taskbar, and Task Manager read the executable's
  # embedded icon rather than BrowserWindow's runtime icon.
  icon: build/icon.ico
  executableName: Deepagens-Worker
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # Release asset URLs stay ASCII so electron-publish can upload an OEM name
  # containing non-ASCII characters without putting it in the request path.
  artifactName: Deepagens-Worker-${version}-win-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Deepagens-Worker
  uninstallDisplayName: Deepagens-Worker
mac:
  # Both architectures are built in one job. The architecture suffix prevents
  # the Intel and Apple Silicon assets from colliding in the GitHub release.
  artifactName: Deepagens-Worker-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  identity: null
  notarize: false
dmg:
  artifactName: Deepagens-Worker-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Development
  # Without an explicit name, AppImage/deb infer executableName from the
  # package.json name (which contains @ and /) and the build fails.
  executableName: deepagens-worker
  # The scoped package name (@deepseek-ai/dsh-desktop) would put the .deb under
  # a missing dist-electron/@deepseek-ai/ directory (fpm: parent directory does
  # not exist). Pin a flat artifact name so both Linux targets write directly
  # under dist-electron/.
  artifactName: Deepagens-Worker-${version}-linux-${arch}.${ext}
publish:
  provider: github
  owner: gitLongjie
  repo: deepseek-harness
  releaseType: release
  # GitHub release tag defaults to v${version}. electron-updater's GitHub
  # provider parses tags as semver, so a non-semver prefix (e.g. desktop-v)
  # breaks in-app update detection; keep the default v prefix.
