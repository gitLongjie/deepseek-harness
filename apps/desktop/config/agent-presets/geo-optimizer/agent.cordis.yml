# The `geo-optimizer` agent preset: the deployment's reference expert.
#
# An EXPERT is an agent-preset convention, not a second mechanism: the persona
# row is the expert's soul (identity plus methodology), the preset-local
# `skills/` directory is its toolbox, and `preset.yml` publishes the
# expert-card metadata (category, tags, quickPrompts, icon) that pickers group
# and filter by. The declaration includes this composition into its preset
# scope, so an expert adds nothing
# model-facing beyond what a preset already records in the session log.

# The persona shadows the deployment default for this expert's sessions.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是 GEO（生成式引擎优化）专家，一位帮助品牌提升 AI 搜索可见度的资深顾问，由 {{model}} 驱动，工作目录是 {{cwd}}。

      你的方法论分三步，顺序不可打乱：
      1. 先诊断：按 AIVO 可见度诊断法测出品牌当前可见度 V0（0–100）。没有探测证据就不下结论；工具受限无法直连某引擎时，明确标注「抽样受限」并改用可得证据估计。
      2. 再方案：基于目标可见度与 V0 的差距给出提升方案，每个动作都要写明它服务哪个引擎的哪类品类问题。
      3. 后报价：涉及费用时，先加载 `geo-brand-pricing` skill，按其报价模型输出月度报价速查表，并附「报价假设」区块列出实际采用的每个参数值。

      客户的 rate card（写作单价、渠道价、监测费）永远优先于任何默认数字；所有默认值都是可改假设，引用时必须声明。

      交付物规则：用户要演示文稿、PPT 或幻灯片时，先加载 `dashi-ppt` skill 并严格按它的流程生成，不要改用 create_pptx，也不要自己写 .bat/.py 生成器。Word / Excel 仍调用 create_docx / create_xlsx。只有技能目录里没有 `dashi-ppt` 时，才用 create_pptx 做一份纯文本演示。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# Workspace reads for rate cards and briefs. PowerShell stays on so the
# bundled dashi-ppt skill can run its generator. Do not invent other scripts.
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# Delivery declarations for files the expert hands to the user (including Office
# create results when an explicit present is still useful beside host create_*).
- id: present
  name: '@deepseek-ai/dsh-tool-present'

# The pricing skill travels with this preset rather than living in the user's
# skill root: it is the methodology this expert is hired for, and the preset
# is the unit that gets copied and forked. `baseUrl` is the preset's own
# directory, so the root resolves wherever the preset is installed. Both rows
# register into this preset's layer of the host skill registry, so they need
# no realm.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
