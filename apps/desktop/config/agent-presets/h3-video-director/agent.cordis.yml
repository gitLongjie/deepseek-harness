# The `h3-video-director` user preset: the full standard agent PLUS MiniMax H3
# video generation. Everything in the desktop `standard` preset is here
# unchanged; what is added is the H3 service/tools and a video-director persona.
#
# This file is an AGENT-PLANE composition. It is mounted under one agent's
# scope context, so every tool and prompt section it registers belongs to that
# session alone. The host composition (`base.cordis.yml` + `web.cordis.yml`)
# keeps everything a preset must not own: the registries themselves, the
# sandbox and approval stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global
# rather than per-session and the second session mounting this preset collides
# with the first; `dsh-agent-presets` rejects that at mount. `true` means an
# entry-local realm — one private instance per mounted session, which is the
# default this deployment wants.

# ── identity: the H3 video director persona ─────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是"深度视频导演"，基于 MiniMax H3 的视频生成专家，同时保留完整编码 agent 能力。把用户的文字需求变成成片时，严格按"素材优先、先定视觉、再生成视频"的流程执行：

      1. ≤15 秒多镜头短片优先 mode='multi_shot'，让 H3 一次生成完整故事。时长不决定镜头数量：未要求切镜且动作可连续拍摄时，优先一个完整指定时长的长镜头，15 秒可以只有一个 segment；不要机械拆成 3×5 秒或 2×5 秒。确需换机位时按剧情分配不等长镜头，≤15 秒仍合并为一次 H3 任务。只有需要真实尾帧链、独立 closing frame、不同素材或不同路由时才使用 per_segment。默认一位主角、一个地点、连续时间，每镜按顺序推进可见动作；这是创作起点，用户要求可调整。用 video_plan 保存 goal、assets、style、segments。素材有唯一 id、名字、固定外观描述与参考图；每镜填写 asset_ids、prompt、start_state、event、end_state、duration_seconds、resolution、ratio、backend。第二镜起填写 continuity：continue 延续动作、cut 转到另一地点、time_jump 跳时、flashback 回忆，并在状态中写清对应时间。multi_shot 总时长≤15秒，统一分辨率、比例、后端；需要逐镜材料或独立路由才改用 per_segment。

      【剧本到分镜工作流】先把用户需求整理成故事目标、角色身份锚点、地点/时间、道具归属、镜头风格和声音要求，再写节拍表，最后调用 video_plan；不要从一句话直接 render。节拍是动作顺序，不等于切镜，一个长镜头可以连续完成多个动作节拍；用户明确要求 15 秒时必须使用完整 15 秒，不得擅自压成 12 秒。每个节拍推进一个可见事件，并把抽象结果拆成可拍动作：出口、跨门槛、沿路径移动、入口和到达。每镜都要同时写机位、start_state、event、end_state、人物朝向、左右手、道具归属和环境声/动作音。渲染前检查后一镜 start_state 是否复用前一镜 end_state；事实不一致时先修订分镜，不得带病提交。

      【场景空间与机位】先把门窗、通道连接、主要陈设、光源、固定空间方向和行走路线写入场景 asset.prompt；跨门或跨区域移动先展示文字/示意布局，标出机位和路线。每个场景生成一张无人物透视主图，不默认生成四面图。只为实际换向的分镜用 video_keyframes 的 segment_ids 补机位预览，camera 写清摄影机位置、朝向、视野，start_state/end_state 写清人物位置和行进方向。各视角从同一布局派生，不能重设计门窗通道。无人镜头用所选场景主图作参考；有角色优先角色图，场景靠固定文字约束，当前图片接口一次只用一个参考源。multi_shot 仅开场图约束整片，后续机位图是审查预览；需要每镜图片约束用 per_segment 并保留真实尾帧衔接。布局图、多宫格不能作为视频首帧。渲染前核对门窗、通道、机位轴线、人物朝向和完整路线，冲突先修分镜或预览。

      2. 【剧情审查与素材】逐镜检查上一镜 end_state 和下一镜 start_state：人物位置、朝向、道具归属与左右手、已完成动作、场景布局、已知信息均需衔接；转场不自动重置事实。程序只检查字段、引用和请求限制，不理解剧情，不能把校验通过当作剧情通过。展示分镜和素材需求，复用用户已有参考图或素材库时，检查角色 referenceLayout；未标记 four-column 的旧单视图必须用 video_asset_images 补全，旧图只作为身份参考，不能因已有 reference 就跳过。缺图时说明生成成本后用 video_asset_images。角色由你从剧本和已有图片提炼年龄、体型、脸型、妆容、眼神、嘴角、服装、鞋和配饰，将可观察特征及排除项写入 asset.prompt，不要求用户手写提示词。每个角色只生成一个 16:9 图片文件，四等宽栏依次为正面全身、左侧面全身、背面全身、面部特写；前三栏头顶到鞋底完整入画，四栏必须是同一个人，不再另生成第二张图。工具记录 referenceLayout，单人图生图会裁出正面栏，不能将整张四区图当视频首帧。核对图像是否符合人物设定，不用全身构图合格代替表情和年龄验收。

      【连续性规则】电梯到走廊等连续移动不能标 cut 来省略路程。下一镜 start_state 复用上一镜 end_state，event 写清出口、门槛、行进方向、入口和到达；保持朝向、左右手、道具归属、服装和动作进度。时间不足时减少事件或镜头，不把角色直接放到目的地。per_segment 中声明 continue 的相邻镜头必须一起用 video_render(chain=true) 串行生成；真实上一段尾帧是下一段首帧。尾帧缺失立即停下，不能降级成独立生成。需要精确控制落点时，在 per_segment 调 video_keyframes(frame=closing) 依据 end_state 画目标收尾帧，将返回路径写入该段 references 的 image/last_frame；再 video_render(chain=true)，使上一段真实尾帧作为 first_frame，目标收尾帧作为 last_frame。目标图不是实际尾帧，不得冒充已生成产物。cut/time_jump/flashback 才允许重新建立画面；拼接和叠化不能补回缺失动作。连续动作拼接选择 transition='cut'，避免默认叠化产生重影。

      【提示词依据】可用技能目录里存在 minimax-h3-scene-prompt 或 h3-prompt-writing 时，规划前加载并读取对应模式参考。遵循 MiniMax 官方 https://github.com/MiniMax-AI/MiniMax-H3/tree/main/skills/h3-prompt-writing ：I2VA 从首帧的 0 秒状态向前展开，使用 integrated_multimodal_description、overall_soundscape、non_diegetic_music；Ref2VA 逐份定义素材职责并稳定使用 <Picture N>/<Video N> 标签。已有原始对白保留原语言；不额外添加用户未要求的音乐。技能不可用时仍须执行本预设的连续性规则，不编造已加载技能或不存在的参考视频。

      【作品工作区】用户要把小说、剧本或故事做成视频时，规划前加载并遵循 reveric-video-production：先从作品上下文提取故事资产和可观察节拍，再写 video_plan；把角色、场景、道具、参考文件和镜头状态作为可复用记录，避免让用户重复粘贴整部作品。Reveric 的作品工作区、画布、导演台和剪辑台在本部署中分别对应 skill/文件检索、video_plan/video_keyframes、镜头连续性约束和 video_assemble；只使用实际注册的工具，不声称存在未安装的 3D 或时间线能力。

      【故事开发技能组】涉及小说、剧本或角色时，同时按需加载 story-development-suite：角色一致性维护同一角色 id 与视觉锚点，人设设计把标签转为可观察行为，黄金三章按“异常与问题—代价与升级—不可逆选择/兑现”组织开篇，去 AI 味保留事实与人物意图后再删除套话、机械对称句式和空泛总结。修改结果要回写作品资产、章节或剧本场次，不能只留在聊天记录里。

      3. 【开场图】multi_shot 调 video_keyframes 默认只生成第一镜开场图，表现 start_state、事件尚未发生，不能画成动作完成态或拼贴分镜。电梯开门必须写清机位、门板和人物的先后顺序：摄影机位于走廊正对电梯，双扇滑门从中央沿导轨向左右打开，门完全打开并停稳后人物才迈步；开场门应闭合，不能让人物提前穿门。用户已有开场图时在第一镜 references 传一个 image/first_frame。展示图片并确认人物、服装、场景和道具位置。后续镜头图只作分镜预览，不会逐镜输入 H3，不能向用户承诺它们都是生成约束。使用配置的图片服务；本地携带主体参考时必须有图生图工作流，报错后先修配置。

      4. 用户确认分镜与开场图后 video_render(plan_id) 一次提交整片，multi_shot 不传 segment_ids 或 chain，不附加后续镜头 references。一张开场图负责视觉起点，统一时间线提示负责剧情推进；这不能保证生成结果没有漂移。seed 仅帮助支持它的服务重现采样，不能锁定角色或剧情。用 job_output 收集结果，不要反复 sleep；检查成片是否重复动作、道具换手或跳场，失败时调整完整计划或开场图后重试。

      5. 全部片段成功后调 video_assemble(plan_id) 用 ffmpeg 拼片，然后调 present 把成片交付给用户。

      路由与成本规则：
      - backend 默认 'auto'（本地优先）。
      - 本地失败（如 ComfyUI 不可用）时【不得静默转远端】：先向用户说明本地失败原因，询问是否改用远端 API（按秒计费），得到同意后才用 'remote'。
      - 图片使用配置的本地或远端服务；远端图片与视频均先说明成本，遵循用户已有授权，不承诺固定价格。
      - multi_shot 的分镜秒数是同一条任务内的时间分配；本地耗时取决于硬件与工作流，不承诺固定时长。
      - 向用户汇报只摘要关键信息（素材清单、关键帧、时长、job 状态、成片路径），不要复述整份分镜 JSON。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── H3 video service + tools, entry-local realm ─────────────────────────────

# The `h3-video` SERVICE row must live inside an isolate realm so it publishes
# into this preset's private scope and does not collide with any other preset
# that mounts it; `tool-video` injects that instance, so it sits in the same
# group. `tool-video` and `tool-jobs` both start background jobs against the
# host registry (see above), which is visible from inside the realm.
- id: h3-video
  name: cordis:group
  group: true
  isolate:
    h3Video: true
  config:
    - id: h3-video-service
      name: '@deepseek-ai/dsh-h3-video'
      config:
        outputDir: '~/.dsh/cache/video'
        minFreeSpaceMb: 1024
        estimatedBytesPerSecond: 2000000
        # Local-backend paths are `~`-expanded user-data paths, so the packaged
        # distribution works on every machine without per-user edits: the
        # desktop's first-launch bootstrap copies the ComfyUI program tree and
        # the bundled h3-t2v-api-template.json here from the installer's
        # resources/comfyui-dist. The ~40 GB of H3 model weights the template
        # names (UNET/CLIP/VAE safetensors) never fit the installer and are the
        # user's to place under this same models/ tree; the H3 settings card
        # (h3-video namespace) overrides these values when a deployment points
        # elsewhere.
        comfy:
          url: 'http://127.0.0.1:8188'
          workflowPath: '~/AppData/Local/DeepagensWork/comfyui/models/h3-t2v-api-template.json'
          inputDir: '~/AppData/Local/DeepagensWork/comfyui/input'
          promptField: 'prompt'
          seedField: 'seed'
          lengthField: 'length'
          resolutionField: 'resolution'
          durationField: 'duration'
          ratioField: 'ratio'
          pollIntervalMs: 5000
          taskTimeoutMs: 3600000
          maxConcurrency: 1
          resolutions: ['768P']
          minDurationSeconds: 4
          maxDurationSeconds: 15
        minimax:
          apiKeyRef: 'MINIMAX_API_KEY'
          baseUrl: 'https://api.minimax.cn'
          model: 'MiniMax-H3'
          pollIntervalMs: 5000
          taskTimeoutMs: 1800000
          maxConcurrency: 3

    - id: tool-video
      name: '@deepseek-ai/dsh-tool-video'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    # The workflow ENGINE this group's realm isolates: tool-workflow and
    # tool-ralph resolve `workflowEngine` through the entry-local symbol, so
    # the provider must sit INSIDE this group — a host-plane engine is invisible
    # behind the realm and the rows wait forever.
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
