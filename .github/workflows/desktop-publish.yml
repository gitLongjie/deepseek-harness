name: Desktop publish

# Builds the desktop shell on all three platforms and publishes the installers
# and update metadata to GitHub Releases via electron-builder --publish always
# (provider: github, owner gitLongjie / repo deepseek-harness). Triggered by a
# v* tag or manually. Signing/notarization secrets are provisioned on the
# desktop-release environment but left empty for now (CSC_IDENTITY_AUTO_DISCOVERY
# false), so builds are unsigned until certificates are configured.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: desktop-release
    steps:
      - uses: actions/checkout@v6

      # Reset and (re)create the release in a single job before any platform
      # builds. Doing this here instead of per-job avoids the concurrent-delete
      # race where parallel platform jobs removed each other's just-created
      # release and then 404'd while uploading assets. The tag is derived from
      # package.json (v<version>) so it works for both tag pushes and manual
      # workflow_dispatch (where github.ref_name is a branch, not the tag).
      - name: Reset and create the release
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          TAG="v$(node -p "require('./apps/desktop/package.json').version")"
          echo "TAG=$TAG"
          # Reset so every platform uploads fresh assets; a missing release is
          # fine. Retry the create briefly to absorb GitHub's delete -> create
          # eventual consistency.
          curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" -o /dev/null || true
          for i in $(seq 1 8); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Release $TAG\"}" \
              "https://api.github.com/repos/$REPO/releases")
            echo "create attempt $i: HTTP $code"
            [ "$code" = "201" ] && { echo "release created"; break; }
            sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    environment: desktop-release
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable, including native optional dependencies)
        run: pnpm install --frozen-lockfile --force --config.optional=true

      - name: Build host libs
        run: pnpm build:lib

      # deploy-app.mjs --publish always builds and uploads to the GitHub
      # Release for the current version (tag v<version>).
      - name: Package and publish to GitHub Releases
        run: pnpm --filter @deepseek-ai/dsh-desktop run release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-artifacts
          path: apps/desktop/dist-electron/**/*
          if-no-files-found: error
          retention-days: 7
