name: Desktop publish

# Builds the desktop shell on Windows and macOS and publishes the installers
# and update metadata to this repository's GitHub Releases — the single
# distribution target. The installed app's updater polls
# releases/latest/download on this repository (the generic updateUrl baked
# from oem.config.json), so this release is the live update feed.
# electron-builder --publish always targets the deepseek-harness repo declared
# in electron-builder.yml and writes with the built-in GITHUB_TOKEN.
# Triggered by a v* tag or manually. Signing/notarization secrets are left
# empty for now (CSC_IDENTITY_AUTO_DISCOVERY false), so builds are unsigned
# until certificates are configured.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Reset and (re)create the release in a single job before any platform
      # builds. Doing this here instead of per-job avoids the concurrent-delete
      # race where parallel platform jobs removed each other's just-created
      # release and then 404'd while uploading assets. The tag is derived from
      # package.json (v<version>) so it works for both tag pushes and manual
      # workflow_dispatch (where github.ref_name is a branch, not the tag).
      # The tag already exists for tag-push runs (the trigger), and
      # target_commitish anchors it to this commit for manual dispatches;
      # GitHub ignores target_commitish when the tag exists.
      - name: Reset and create the release
        shell: bash
        run: |
          TAG="v$(node -p "require('./apps/desktop/package.json').version")"
          echo "TAG=$TAG"
          # Reset so every platform uploads fresh assets; a missing release is
          # fine. electron-builder skips assets whose name already exists on
          # the release it finds, so a release that survives the delete leaves
          # the previous build's installers in place (observed on the v1.2.9
          # tag re-push). Both steps verify and fail loud instead.
          curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -o /dev/null || true
          code=200
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
            [ "$code" = "404" ] && { echo "release deleted"; break; }
            sleep 5
          done
          if [ "$code" != "404" ]; then
            echo "the previous release survived deletion (HTTP $code); refusing to publish over it"
            exit 1
          fi
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Release $TAG\",\"target_commitish\":\"$GITHUB_SHA\"}" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases")
            echo "create attempt $i: HTTP $code"
            [ "$code" = "201" ] && { echo "release created"; break; }
            sleep 5
          done
          if [ "$code" != "201" ]; then
            echo "the release create never succeeded (last HTTP $code)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: ${{ matrix.os }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build host libs
        run: pnpm build:lib

      # Package the --dir artifact and boot it under the smoke harness, and
      # only after the smoke passes run the full release build with
      # --publish always (same rev), which attaches the installers, blockmaps,
      # and latest*.yml to the release created above. latest.yml /
      # latest-mac.yml on that release are the electron-updater feed the
      # installed apps poll. A packaged artifact that cannot boot never
      # reaches users.
      - name: Package, smoke, and publish to GitHub Releases
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum pnpm --filter @deepseek-ai/dsh-desktop run smoke -- --publish
          else
            pnpm --filter @deepseek-ai/dsh-desktop run smoke -- --publish
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-artifacts
          path: apps/desktop/dist-electron/**/*
          if-no-files-found: error
          retention-days: 7
